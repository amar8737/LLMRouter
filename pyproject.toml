[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmrouterx"
version = "0.1.17"
description = "Intelligent routing, load balancing, and failover for LLM providers"
readme = "README.md"
requires-python = ">=3.10"
authors = [ { name = "Amar Jeet Kushwaha", email = "babuamar455@gmail.com" } ]
license = { file = "LICENSE" }
keywords = ["llm", "router", "openai", "providers"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"License :: OSI Approved :: Apache Software License",
	"Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/amar8737/LLMRouter"
Source = "https://github.com/amar8737/LLMRouter/"
Tracker = "https://github.com/amar8737/LLMRouter/issues"

[project.optional-dependencies]
dev = [
	"pytest",
	"pytest-asyncio",
	"pytest-cov",
	"ruff",
	"mypy",
]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
langfuse = ["langfuse>=3.0"]
server = [
	"fastapi>=0.100.0",
	"uvicorn>=0.23.0",
	"pydantic>=2.0.0",
	"httpx[http2]>=0.24.0",
	"uvloop>=0.17.0; platform_system != 'Windows'",
]

[project.scripts]
llmrouterx = "llmrouterx.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "run_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["llmrouterx"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
omit = ["tests/*"]

[tool.mypy]
python_version = "3.10"
files = ["llmrouterx"]
warn_unreachable = true
no_implicit_optional = true
show_error_codes = true
check_untyped_defs = false

# Optional runtime extras (httpx, langfuse, fastapi, pydantic, starlette,
# uvicorn) are not installed in minimal/typecheck-only environments, so mypy
# must not treat their absence as an error. When an extra *is* installed mypy
# still uses its real types. Provider SDKs are imported lazily / guarded with
# inline ``# type: ignore[import-not-found]`` and are not listed here.
[[tool.mypy.overrides]]
module = [
    "httpx",
    "langfuse",
    "fastapi",
    "fastapi.*",
    "pydantic",
    "pydantic.*",
    "starlette",
    "starlette.*",
    "uvicorn",
]
ignore_missing_imports = true
# Optional extras can be absent (CI lint) or present alongside incompatible
# transitive stubs (e.g. an older numpy). Treat them as Any instead of
# following their bodies, so ``mypy llmrouterx`` is stable across environments.
follow_imports = "skip"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = [
    "UP017",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"