[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmrouterx"
version = "0.1.9"
description = "Intelligent routing, load balancing, and failover for LLM providers"
readme = "README.md"
requires-python = ">=3.10"
authors = [ { name = "Amar Jeet Kushwaha", email = "babuamar455@gmail.com" } ]
license = { file = "LICENSE" }
keywords = ["llm", "router", "openai", "providers"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"License :: OSI Approved :: Apache Software License",
	"Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/amar8737/LLMRouter"
Source = "https://github.com/amar8737/LLMRouter/"
Tracker = "https://github.com/amar8737/LLMRouter/issues"

[project.optional-dependencies]
dev = [
	"pytest",
	"pytest-asyncio",
	"ruff",
]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "run_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = [
    "UP017",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"