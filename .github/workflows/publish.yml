name: Publish

on:
  push:
    branches:
      - main 
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build setuptools wheel

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        timeout-minutes: 10
        run: |
          python tests/run_tests.py

      - name: Build distributions
        run: |
          python -m build --sdist --wheel --outdir dist

      - name: Publish to PyPI (twine)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          # Prefer to use a configured PYPI_API_TOKEN; skip if not set.
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "No PYPI_API_TOKEN configured; skipping publish."
            exit 0
          fi
          python -m pip install --upgrade pip
          pip install twine
          twine upload dist/* -u "$TWINE_USERNAME" -p "$TWINE_PASSWORD"

      # Notes:
      # - This uses GitHub OIDC (Trusted Publisher) automatically when the repository
      #   is registered on PyPI as a Trusted Publisher. If not registered yet,
      #   either register GitHub as a Trusted Publisher on PyPI or replace this step
      #   with a `twine upload` step that uses a `PYPI_API_TOKEN` repository secret.