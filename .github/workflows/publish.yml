name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine
          pip install -e .[dev]
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run tests
        timeout-minutes: 5
        run: |
          python -m pytest -v --tb=short
          python tests/run_tests.py

      - name: Build distributions
        run: |
          python -m build --sdist --wheel --outdir dist

      - name: Check version not already on PyPI
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Building llmrouterx version $version"
          if curl -fsSL "https://pypi.org/pypi/llmrouterx/json" 2>/dev/null | python -c "import json,sys; print('$version' in json.load(sys.stdin).get('releases', {}))" | grep -q True; then
            echo "::error::Version $version already exists on PyPI. Bump the version in pyproject.toml before publishing."
            exit 1
          fi
          echo "Version $version is new — proceeding."

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "⚠️  No PYPI_API_TOKEN configured; skipping publish"
            exit 0
          fi
          echo "📦 Publishing to PyPI..."
          twine upload dist/* -u "$TWINE_USERNAME" -p "$TWINE_PASSWORD"
          echo "✅ Published successfully"
