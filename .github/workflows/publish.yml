name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build setuptools wheel

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          PYTHONPATH=$(pwd) pytest -q

      - name: Build distributions
        run: |
          python -m build --sdist --wheel --outdir dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish to PyPI (fallback with twine)
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install twine
          twine upload dist/* -u "$TWINE_USERNAME" -p "$TWINE_PASSWORD"

      # Notes:
      # - This uses GitHub OIDC (Trusted Publisher) automatically when the repository
      #   is registered on PyPI as a Trusted Publisher. If not registered yet,
      #   either register GitHub as a Trusted Publisher on PyPI or replace this step
      #   with a `twine upload` step that uses a `PYPI_API_TOKEN` repository secret.