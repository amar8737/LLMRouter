name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build setuptools wheel

      - name: Build distributions
        run: |
          python -m build --sdist --wheel --outdir dist

      # Exchange GitHub OIDC token for a short-lived PyPI upload token.
      # This requires registering GitHub as a Trusted Publisher on PyPI.
      - name: Exchange OIDC for PyPI token
        id: pypi-token
        uses: pypa/gh-action-get-pypi-token@v1

      - name: Publish to PyPI (via pypa action)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          token: ${{ steps.pypi-token.outputs.token }}

      # Notes:
      # - To use this OIDC flow you must register GitHub as a Trusted Publisher in PyPI:
      #   https://pypi.org/manage/account/trusted-publishers/
      # - If you prefer a token-based upload instead, replace the exchange/publish
      #   steps with a `twine upload` step using a `PYPI_API_TOKEN` repository secret.